[project]
name = "grok-search-mcp"
version = "0.2.0"
description = "Grok 4.6 research MCP with source evidence and claim verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.25.0,<2",
    "xai-sdk>=1.12.2,<2",
    "pydantic>=2.12,<3",
    "aiohttp>=3.13.3,<4",
    "beautifulsoup4>=4.13,<5",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[project.scripts]
grok-search-mcp = "grok_search_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_search_mcp"]
